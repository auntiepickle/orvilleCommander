<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orville Commander</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="rack">
      <!-- Connection strip: where a power/status section lives on hardware -->
      <header class="conn-strip">
        <span class="conn-label">MIDI</span>
        <button id="connect" class="util-btn">Connect</button>
        <select id="output-select" class="util-input" title="MIDI output port"></select>
        <select id="input-select" class="util-input" title="MIDI input port"></select>
        <label class="util-label" for="device-id">DEV ID</label>
        <input
          id="device-id"
          class="util-input util-num"
          type="number"
          min="0"
          max="127"
          value="0"
        />
        <button id="select-ports" class="util-btn util-btn-primary">Select Ports</button>
        <button
          id="demo-mode"
          class="util-btn"
          title="Browse with the unit off — a captured device tree answers instead"
        >
          Demo Mode
        </button>
        <span class="conn-spacer"></span>
        <!-- Preset library (#142): search across every synced bank; Sync
             Library scans all banks (several minutes) and persists. -->
        <span class="search-wrap">
          <input
            id="preset-search"
            class="util-input util-search"
            placeholder="Search presets (sync first)"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="search-results" class="search-results" hidden></div>
        </span>
        <button
          id="sync-library"
          class="util-btn"
          title="Scan every bank's program list so search covers the whole unit (several minutes)"
        >
          Sync Library
        </button>
        <span id="sync-status" class="sync-status">not synced</span>
        <span class="conn-spacer"></span>
        <button id="save-config" class="util-btn">Save Config</button>
        <button id="clear-config" class="util-btn">Clear Config</button>
      </header>

      <!-- The unit -->
      <section class="faceplate">
        <div class="rack-ear rack-ear-left"><i class="screw"></i><i class="screw"></i></div>

        <div class="panel">
          <div class="brand-block">
            <div class="wordmark">
              <span class="wordmark-main">Orville</span>
              <span class="wordmark-sub">COMMANDER</span>
            </div>
            <!-- Manual p.8 items A/B: the four level meters and the system
                 sampling-rate / external-sync indicator column. Decorative
                 until #10 lands real metering. -->
            <div class="indicator-cluster" aria-hidden="true">
              <div class="level-meters">
                <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><b>1</b></div>
                <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><b>2</b></div>
                <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><b>3</b></div>
                <div class="meter"><i></i><i></i><i></i><i></i><i></i><i></i><b>4</b></div>
              </div>
              <div class="clock-leds">
                <div class="clock-led"><i></i><b>96K</b></div>
                <div class="clock-led"><i></i><b>88.2K</b></div>
                <div class="clock-led lit"><i></i><b>48K</b></div>
                <div class="clock-led"><i></i><b>44.1K</b></div>
                <div class="clock-led clock-led-ext"><i></i><b>EXT</b></div>
              </div>
            </div>
            <div class="power-switch" aria-hidden="true">
              <span class="rocker"><i></i></span>
              <b>POWER</b>
            </div>
            <div class="unit-badge">DUAL DSP &nbsp;•&nbsp; 24 BIT</div>
          </div>

          <div class="display-block">
            <div class="bezel">
              <div id="lcd" class="lcd"></div>
              <!-- Glass pane over the display: pure presentation, a SIBLING
                   of #lcd (the renderer owns the #lcd subtree — never put
                   chrome inside it). pointer-events: none keeps every LCD
                   click affordance live underneath. -->
              <div class="glass" aria-hidden="true"></div>
            </div>
            <div class="soft-keys">
              <button id="soft1-btn" class="key key-soft" aria-label="Soft key 1"></button>
              <button id="soft2-btn" class="key key-soft" aria-label="Soft key 2"></button>
              <button id="soft3-btn" class="key key-soft" aria-label="Soft key 3"></button>
              <button id="soft4-btn" class="key key-soft" aria-label="Soft key 4"></button>
            </div>
          </div>

          <div class="controls-block">
            <!-- Hold sub-labels are the manual's real hold functions (p.8-9):
                 PROGRAM-hold = routing storage, PARAMETER-hold = patch
                 editor, SELECT-hold = remote-control setup. -->
            <div class="key-group function-keys">
              <div class="key-col">
                <button id="ab-btn" class="key key-accent">DSP A/B</button>
                <div class="bypass-leds" aria-hidden="true">
                  <span class="status-led"><i></i><b>A</b></span>
                  <span class="status-led"><i></i><b>B</b></span>
                </div>
                <button id="bypass-btn" class="key key-danger">BYPASS</button>
              </div>
              <div class="key-col">
                <button id="program-btn" class="key">PROGRAM</button>
                <button id="program-hold-btn" class="key key-hold">HOLD · ROUTING</button>
              </div>
              <div class="key-col">
                <button id="parameter-btn" class="key">PARAMETER</button>
                <button id="parameter-hold-btn" class="key key-hold">HOLD · PATCH</button>
              </div>
              <div class="key-col">
                <button id="select-btn" class="key">SELECT</button>
                <button id="select-hold-btn" class="key key-hold">HOLD · REMOTE</button>
              </div>
              <div class="key-col">
                <button id="levels-btn" class="key">LEVELS</button>
                <button id="setup-btn" class="key">SETUP</button>
              </div>
            </div>

            <div class="key-group cursor-keys">
              <button id="up-btn" class="key key-cursor" aria-label="Cursor up">▲</button>
              <button id="left-btn" class="key key-cursor" aria-label="Cursor left">◀</button>
              <button id="right-btn" class="key key-cursor" aria-label="Cursor right">▶</button>
              <button id="down-btn" class="key key-cursor" aria-label="Cursor down">▼</button>
            </div>

            <!-- Manual p.9 items L/O: the KNOB plus INC/DEC keys. The knob
                 answers wheel-scroll and vertical drag (controls.js). -->
            <div class="key-group wheel-keys">
              <span class="group-legend">DATA</span>
              <div id="data-knob" class="knob" role="slider" aria-label="Data knob" tabindex="0">
                <i class="knob-pointer"></i>
              </div>
              <div class="incdec">
                <button id="inc-btn" class="key key-wheel" aria-label="Increment">▲</button>
                <button id="dec-btn" class="key key-wheel" aria-label="Decrement">▼</button>
              </div>
            </div>

            <div class="key-group keypad">
              <button id="7-btn" class="key key-num">7</button>
              <button id="8-btn" class="key key-num">8</button>
              <button id="9-btn" class="key key-num">9</button>
              <button id="4-btn" class="key key-num">4</button>
              <button id="5-btn" class="key key-num">5</button>
              <button id="6-btn" class="key key-num">6</button>
              <button id="1-btn" class="key key-num">1</button>
              <button id="2-btn" class="key key-num">2</button>
              <button id="3-btn" class="key key-num">3</button>
              <button id="dot-btn" class="key key-num">·</button>
              <button id="0-btn" class="key key-num">0</button>
              <button id="minus-btn" class="key key-num">−</button>
              <button id="cxl-btn" class="key key-num key-danger">CXL</button>
              <button id="enter-btn" class="key key-num key-accent keypad-enter">ENT</button>
            </div>
          </div>

          <!-- Manual p.10 items Q/R/S: BUSY LED (wired to dump waves —
               lit while data moves on the MIDI link) over the memory card
               slot and its release key (decorative). -->
          <div class="card-block">
            <span id="busy-led" class="status-led busy"><i></i><b>BUSY</b></span>
            <div class="card-slot" aria-hidden="true"></div>
            <span class="card-release" aria-hidden="true"></span>
            <b class="card-legend" aria-hidden="true">MEMORY CARD</b>
          </div>
        </div>

        <div class="rack-ear rack-ear-right"><i class="screw"></i><i class="screw"></i></div>
      </section>

      <!-- Service hatch: every diagnostic control, one click away -->
      <details class="service-panel">
        <summary><span class="hazard"></span>SERVICE<span class="hazard"></span></summary>
        <div class="service-body">
          <div class="service-col">
            <h3 class="service-heading">True screen (0x17 capture)</h3>
            <canvas id="lcd-canvas"></canvas>
            <div class="service-row">
              <button id="get-screen-btn" class="util-btn">Get Screen Bitmap</button>
              <button id="sync-btn" class="util-btn">Sync to Hardware</button>
            </div>
            <div class="service-row">
              <button id="toggle-meter-polling" class="util-btn">Toggle Meter Polling</button>
              <span id="polling-indicator" class="led-label">Polling Active</span>
              <button id="poll-toggle" class="util-btn">Toggle Polling</button>
              <button id="test-keypress" class="util-btn">Test Keypress</button>
            </div>
            <div class="service-row">
              <label class="toggle"
                ><input type="checkbox" id="fetch-bitmap" checked /><span>Fetch bitmap</span></label
              >
              <label class="toggle"
                ><input type="checkbox" id="update-bitmap-on-change" checked /><span
                  >Bitmap on change</span
                ></label
              >
              <label class="toggle"
                ><input type="checkbox" id="eager-load" checked /><span
                  >Eager-load preset tree</span
                ></label
              >
            </div>
          </div>
          <div class="service-col">
            <h3 class="service-heading">Theme</h3>
            <div class="service-row">
              <label class="util-label" for="theme-preset">PRESET</label>
              <select id="theme-preset" class="util-input"></select>
              <button id="theme-reset" class="util-btn">Reset Overrides</button>
            </div>
            <!-- One swatch row per registry token (theme.js THEME_TOKENS) -->
            <div id="theme-tokens" class="theme-tokens"></div>
          </div>
          <div class="service-col">
            <h3 class="service-heading">Diagnostics</h3>
            <div class="service-row">
              <input
                id="custom-sysex"
                class="util-input util-wide"
                placeholder="Custom SysEx hex (e.g. 01 0f 0f…)"
              />
              <button id="send-custom" class="util-btn">Send</button>
            </div>
            <div class="service-row">
              <input type="file" id="upload-debug-file" class="util-input" />
              <button id="process-debug-file" class="util-btn">Process Debug File</button>
            </div>
            <div class="service-row">
              <label class="util-label" for="log-level">LOG</label>
              <select id="log-level" class="util-input">
                <option value="debug">Debug</option>
                <option value="info" selected>Info</option>
                <option value="error">Error</option>
              </select>
              <button id="copy-log" class="util-btn">Copy Log</button>
            </div>
            <textarea id="log-area" readonly spellcheck="false"></textarea>
          </div>
        </div>
      </details>
    </main>
  </body>
</html>
